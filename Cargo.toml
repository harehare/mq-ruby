[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "Ruby bindings for mq Markdown processing"
edition = "2024"
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query", "ruby"]
license = "MIT"
name = "mq-ruby"
publish = false
readme = "README.md"
repository = "https://github.com/harehare/mq"
version = "0.1.32"

[lib]
crate-type = ["cdylib"]
name = "mq_ruby"

[dependencies]
magnus = {version = "0.8"}
mq-lang = {version = "0.8.1", features = ["css-selector"]}
mq-markdown = "0.8.1"
# Pinned below the rb-sys releases (0.9.120+) that added Ruby 4.x-specific
# ABI handling, which is buggy on Ruby 4.0 under magnus 0.8.2 and breaks
# TypedData class conversion (see MQ::Result CI failures on Ruby 4.0).
rb-sys = "=0.9.117"

