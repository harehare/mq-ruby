name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
          build-warnings: ""
      - name: Set up Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@v1.299.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ruby-${{ steps.setup-ruby.outputs.ruby-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Build Rust extension
        run: bundle exec rake compile
      - name: Run RSpec tests
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: clippy
          cache: false
          rustflags: ""
          build-warnings: ""
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Run Clippy
        run: cargo clippy -- -D warnings

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: rustfmt
          cache: false
          rustflags: ""
          build-warnings: ""
      - name: Check formatting
        run: cargo fmt -- --check
